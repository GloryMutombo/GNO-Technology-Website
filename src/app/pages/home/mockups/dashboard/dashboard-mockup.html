<div class="dashboard">
  <div class="window-bar">
    <span></span><span></span><span></span>
    <div>workspace.gnod.co.za</div>
  </div>
  <div class="dashboard__body">
    <aside class="dashboard__rail">
      <div class="dashboard__brand">
        <lucide-icon aria-hidden="true" name="braces" [size]="16" />
      </div>
      <lucide-icon aria-hidden="true" name="layout-dashboard" [size]="15" />
      <lucide-icon aria-hidden="true" name="folder" [size]="15" />
      <lucide-icon aria-hidden="true" name="users" [size]="15" />
      <lucide-icon aria-hidden="true" name="chart-column" [size]="15" />
      <lucide-icon aria-hidden="true" name="settings" [size]="15" />
    </aside>
    <div class="dashboard__main">
      <div class="dashboard__heading">
        <div><strong>Operations overview</strong><small>Live business intelligence</small></div>
        <b>● All systems live</b>
      </div>
      <div class="metrics">
        <div>
          <small>Active projects</small><strong appCountUp="1150" countTo="18">0</strong><em>+3</em>
        </div>
        <div>
          <small>Team capacity</small><strong appCountUp="1280" countTo="82">0%</strong
          ><em>steady</em>
        </div>
        <div>
          <small>Open actions</small><strong appCountUp="1410" countTo="24">0</strong><em>-6</em>
        </div>
      </div>
      <div class="dashboard__panels">
        <div class="chart-panel">
          <strong>Delivery performance</strong>
          <div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="activity-panel">
          <strong>Recent activity</strong>
          <span>Mobile release ready</span><span>API review complete</span
          ><span>Data sync running</span>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="dashboard-note">
  <lucide-icon aria-hidden="true" name="code-xml" [size]="17" />
  <span><strong>Purpose-built</strong><small>Secure • scalable • supported</small></span>
</div>
